spring.application.name=Queue_backend

# Tests run on an in-memory H2 database in MySQL mode, so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:queue_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-that-is-long-enough-for-hs256-signing
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:*
