spring.application.name=Queue_backend
server.port=4887

# DB Config (override with DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/queue_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT: set JWT_SECRET (32+ characters). If unset, a random secret is generated at startup.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# CORS: comma-separated origin patterns allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
